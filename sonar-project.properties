# --- Identité du projet (à vérifier sur sonarcloud.io) ---
# La clé d'organisation est visible dans SonarCloud > ton orga > Administration.
sonar.organization=mathbech
sonar.projectKey=Mathbech_my-git-stats
sonar.projectName=my-git-stats

# --- Analyse ---
sonar.sources=src,server.js
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Rapport de couverture généré par `npm run coverage:lcov`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fichiers hors périmètre d'analyse.
sonar.exclusions=assets/**,scripts/preview-*,node_modules/**,coverage/**
